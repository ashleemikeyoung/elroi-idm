welcomeText=Simlah provides user federation, strong authentication, user management, fine-grained authorization, and more. Add authentication to applications and secure services with minimum effort. No need to deal with storing users or authenticating users.
introduction=Simlah provides user federation, strong authentication, user management, fine-grained authorization, and more. Add authentication to applications and secure services with minimum effort. No need to deal with storing users or authenticating users.

# Simlah: the parent theme's English text, with "ElRoi IdM" (the server's built-in product name)
# replaced. Regenerate when the server is upgraded.
sync-ldap-roles-to-keycloak=Sync LDAP roles to Simlah
authDataDescription=Represents a token carrying authorization data as a result of the processing of an authorization request. This representation is basically what Simlah issues to clients asking for permission. Check the `authorization` claim for the permissions that where granted based on the current authorization request.
serviceAccountHelp=Allows you to authenticate this client to Simlah and retrieve access token dedicated to this client. In terms of OAuth2 specification, this enables support of 'Client Credentials Grant' for this client.
bindDnHelp=DN of the LDAP admin, which will be used by Simlah to access LDAP server
policyProvider.js=Define conditions for your permissions using JavaScript. It is one of the rule-based policy types supported by Simlah, and provides flexibility to write any policy based on the Evaluation API.
disableSigningExplain=If you disable "{{key}}", the Simlah database will be updated and you may need to download a new adapter for this client.
clientPkceRequiredHelp=Require Proof Key for Code Exchange (PKCE) to protect against authorization code interception attacks. Public clients (client authentication disabled) should always require PKCE as they cannot securely store client secrets. It is also recommended for confidential clients as an additional layer of security. If not required, Simlah only uses PKCE when the client includes a code challenge and method in its authorization request.
generateKeysDescription=If you generate new keys, you can download the keystore with the private key automatically and save it on your client's side. Simlah server will save just the certificate and public key, but not the private key. Key generation is deprecated. Keys should be imported instead.
useTruststoreSpiHelp=Specifies whether LDAP connection will use the Truststore SPI with the truststore configured in command-line options. 'Always' means that it will always use it. 'Never' means that it will not use it. Note that even if Simlah truststore is not configured, the default java cacerts or certificate specified by 'javax.net.ssl.trustStore' property will be used.
periodicFullSyncHelp=If 'Import users' is enabled, a periodic task is started to synchronize users from LDAP to Simlah. This type of synchronization fetches all users from LDAP on every run, importing new users or updating existing ones. If you have a large number of users in LDAP, this may be inefficient. In that case, you can disable this option and use 'Periodic changed users sync' instead.
periodicChangedUsersSyncHelp=If 'Import users' is enabled, a periodic task is started to synchronize users from LDAP to Simlah based on their created or last updated timestamps. This type of synchronization is more efficient than a full sync, especially if you have a large number of users in LDAP. However, it requires that your LDAP server supports searching using the attributes 'createTimestamp' and 'modifyTimestamp' in query predicates.
dropNonexistingGroupsDuringSyncHelp=If this flag is true, then during sync of groups from LDAP to Simlah, we will keep just those Simlah groups that still exist in LDAP. The rest will be deleted.
firstBrokerLoginFlowAliasOverrideHelp=Alias of authentication flow, which is triggered after the first login with this identity provider. The term 'First Login' means that no Simlah account is currently linked to the authenticated identity provider account.
kubernetesIssuerUrlHelp=Optional issuer of the Kubernetes service account tokens. If omitted, Simlah resolves it from the issuer discovery URL when configured; otherwise, it uses the default Kubernetes issuer.
kubernetesIssuerDiscoveryUrlHelp=Optional Kubernetes API server or external OIDC discovery base URL. When configured, Simlah resolves and persists the issuer and JWKS URL when the identity provider is saved or updated.
clientAuthenticatorTypeHelp=Client Authenticator used for authentication of this client against Simlah server
reGenerateSigningExplain=If you regenerate the signing key for client, a new certificate will be stored in the Simlah database. The private key will be downloaded once and is not stored on the server. You may need to reconfigure your client application. Key generation is deprecated. Keys should be imported instead.
reGenerateEncryptionExplain=If you regenerate the encryption key for client, a new certificate will be stored in the Simlah database. The private key will be downloaded once and is not stored on the server. You may need to reconfigure your client application. Key generation is deprecated. Keys should be imported instead.
useRealmRolesMappingHelp=If true, then LDAP role mappings will be mapped to realm role mappings in Simlah. Otherwise it will be mapped to client role mappings.
oAuthMutualHelp=This enables support for OAuth 2.0 Mutual TLS Certificate Bound Access Tokens, which means that Simlah binds an access token and a refresh token with an X.509 certificate of a token requesting client exchanged in mutual TLS between keycloak's Token Endpoint and this client. These tokens can be treated as Holder-of-Key tokens instead of bearer tokens.
directAccessHelp=This enables support for Direct Access Grants, which means that client has access to username/password of user and exchange it directly with Simlah server for access token. In terms of OAuth2 specification, this enables support of 'Resource Owner Password Credentials Grant' for this client.
confirmClientSecretBody=If you regenerate the secret, the Simlah database will be updated and you will need to download a new adapter for this client.
batchSizeHelp=Count of LDAP users to be imported from LDAP to Simlah within a single transaction
useDiscoveryEndpointHelp=If this setting is enabled, the discovery endpoint will be used to fetch the provider config. Simlah can load the config from the endpoint and automatically update the config if the source has any updates.
minimumACRValueHelp=Minimum ACR to be enforced by Simlah. Overrides lower ACRs explicitly requested by 'acr_values' or 'claims', unless they are marked as essential.
minimumACRValueSamlHelp=Minimum ACR to be enforced by Simlah. If the resulting authentication context for the request is as strong as this ACR the request is valid, otherwise Simlah returns the NoAuthnContext status error.
sync-keycloak-roles-to-ldap=Sync Simlah roles to LDAP
groupsPathHelp=Simlah group path the LDAP groups are added to. For example if value '/Applications/App1' is used, then LDAP groups will be available in Simlah under group 'App1', which is child of top level group 'Applications'. The default value is '/' so LDAP groups will be mapped to the Simlah groups at the top level. The configured group path must already exist in the Simlah when creating this mapper.
usernameLdapAttributeHelp=Name of the LDAP attribute, which is mapped as Simlah username. For many LDAP server vendors it can be 'uid'. For Active directory it can be 'sAMAccountName' or 'cn'. The attribute should be filled for all LDAP user records you want to import from LDAP to Simlah.
connectionPoolingHelp=Determines if Simlah should use connection pooling for accessing LDAP server. Connection pooling cannot be used if StartTLS is enabled.
preserveGroupInheritanceHelp=Flag whether group inheritance from LDAP should be propagated to Simlah. If false, then all LDAP groups will be mapped as flat top-level groups in Simlah. Otherwise group inheritance is preserved into Simlah, but the group sync might fail if LDAP structure contains recursions or multiple parent groups per child groups.
modeHelp=LDAP_ONLY means that all group mappings of users are retrieved from LDAP and saved into LDAP. READ_ONLY is Read-only LDAP mode where group mappings are retrieved from both LDAP and the database and they are merged together. New group joins are not saved to LDAP but to the database. IMPORT is Read-only LDAP mode where group mappings are retrieved from LDAP when the user is imported from LDAP and then they are saved to the local Simlah database.
ldapSynchronizationSettingsDescription=This section contains options related to synchronization of users from LDAP to the Simlah database.
mapperTypeHelp=Used to map single attribute from LDAP user to attribute of UserModel in Simlah database
editModeKerberosHelp=READ_ONLY means that password updates are not allowed and user always authenticates with Kerberos password. UNSYNCED means that the user can change the password in the Simlah database and this one will be used instead of the Kerberos password.
userObjectClassesHelp=All values of LDAP objectClass attribute for users in LDAP, divided by commas. For example\: 'inetOrgPerson, organizationalPerson'. Newly created Simlah users will be written to LDAP with all those object classes and existing LDAP user records are found just if they contain all those object classes.
requiresShortStateParameterHelp=This switch needs to be enabled if identity provider does not support long value of the 'state' parameter sent in the initial OIDC/OAuth2 authentication request (EG. more than 100 characters). In this case, Simlah will try to make shorter 'state' parameter and may omit some client data to be sent in the initial request. This may result in the limited functionality in some very corner case scenarios (EG. in case that IDP redirects to Simlah with the error in the OIDC authentication response, Simlah might need to display error page instead of being able to redirect to the client in case that login session is expired).
readOnlyHelp=Read-only attribute that is imported from LDAP to UserModel but is not saved back to LDAP when the user is updated in Simlah.
changeAuthenticatorConfirm=If you change authenticator to {{clientAuthenticatorType}}, the Simlah database will be updated and you may need to download a new adapter configuration for this client.
listExplain=Identity providers are social networks or identity brokers that allow users to authenticate to Simlah.
alwaysReadValueFromLdapHelp=If on, then during reading of the LDAP attribute value will always be used instead of the value from Simlah database.
sync-ldap-groups-to-keycloak=Sync LDAP groups to Simlah
validatePasswordPolicyHelp=Determines if Simlah should validate the password with the realm password policy before updating it. When the user's password is saved in LDAP, some Simlah password policies do not work: Not Recently Used, Expire Password, Hashing Iterations, and Hashing Algorithm. This situation occurs because Simlah does not have direct control over the password storage. if you want to use those policies, enable password policies at the LDAP server layer.
fullNameLdapReadOnlyHelp=For Read-only, data is imported from LDAP to the Simlah database, but it is not saved back to LDAP when the user is updated in Simlah.
useJwksUrlHelp=If the switch is ON, identity provider public keys are downloaded from a given JWKS URL. The result is great flexibility because new keys are downloaded again when the identity provider generates a new keypair. If the switch is OFF, a public key (or certificate) from the Simlah database is used; therefore, when the identity provider keypair changes, you again need to import the new key to the Simlah database.
backchannelLogoutRevokeOfflineSessionsHelp=Specifying whether a "revoke_offline_access" event is included in the Logout Token when the Backchannel Logout URL is used. Simlah will revoke offline sessions when receiving a Logout Token with this event.
validateSignatureHelp=Enable/disable signature validation of external IDP tokens such as ID tokens and access tokens. Note that backchannel logout tokens are always validated regardless of this setting. When signature validation is required, Simlah must know the public key of the external OIDC IDP.
fullNameLdapWriteOnlyHelp=For Write-only, data is propagated to LDAP when a user is created or updated in Simlah. But this mapper is not used to propagate data from LDAP back into Simlah. This setting is useful if you configured separate firstName and lastName attribute mappers and you want to use those to read the attribute from LDAP into Simlah.
keysIntro=If "Use JWKS URL switch" is on, you need to fill a valid JWKS URL. After saving, admin can download keys from the JWKS URL or keys will be downloaded automatically by Simlah server when an unknown KID is seen during client authentication.
isMandatoryInLdapHelp=If true, this attribute is mandatory in LDAP. If no value exists in the Simlah database, the empty value is propagated to LDAP.
mappedGroupAttributesHelp=List of names of attributes divided by commas. This points to the list of attributes on LDAP group, which will be mapped as attributes of Group in Simlah. Leave this empty if no additional group attributes are required to be mapped in Simlah.
attributeDefaultValueHelp=If no value exists in the Simlah database and the attribute is mandatory in LDAP, this value is propagated to LDAP.
ssfStreamManagedByHelp=Whether this stream was registered by the SSF receiver via the standard /streams endpoint, or created by an Simlah admin via the Admin UI. Set at creation time. The stream configuration (description, requested and delivered events) can only be edited here for Simlah-managed streams; for receiver-managed streams it is read-only and changed by the receiver. The stream status (enable, pause, disable) can always be changed here, regardless of who manages the stream.
ssfStreamManagedByKeycloak=Simlah
ssfEmitOnlyEventsHelp=Subset of Supported events that Simlah should NOT auto-emit from native event listeners. Events listed here still travel over the wire when fired explicitly via the synthetic emit endpoint, but Simlah's automatic mapping skips them. Use this when an event type should reach the receiver only on demand. Empty = every supported event auto-emits (default).
sync-keycloak-groups-to-ldap=Sync Simlah groups to LDAP
krbPrincipalAttributeHelp=Name of the LDAP attribute, which refers to Kerberos principal. This is used to lookup appropriate LDAP user after successful Kerberos/SPNEGO authentication in Simlah. When this is empty, the LDAP user will be looked based on LDAP username corresponding to the first part of his Kerberos principal. For instance, for principal 'john@KEYCLOAK.ORG', it will assume that LDAP username is 'john'.
artifactResolutionServiceHelp=SAML Artifact resolution service for the client. This is the endpoint to which Simlah will send a SOAP ArtifactResolve message. You can leave this blank if you do not have a URL for this binding.
nodeReRegistrationTimeoutHelp=Interval to specify max time for registered clients cluster nodes to re-register. If cluster node will not send re-registration request to Simlah within this time, it will be unregistered from Simlah.
transientUserTooltip=This user not stored in Simlah database. It is constructed solely from data provided by the originating identity provider.
ssfEmitSubjectValueHelp=Resolves to an Simlah user (user-id / user-email / user-username) or organization (org-alias). For user subjects the transmitter builds the sub_id using the receiver's configured User Subject Format so the emitted SET matches the shape of a native event for this receiver; org subjects emit a complex tenant-only subject. Subject-subscription filters and the format-specific fail-loud rules (no email, no organization for +tenant) still apply.
ssfReceiverHelp=Transmitter-side policy applied when Simlah delivers Security Event Tokens to this receiver.
ssfAllowedDeliveryMethods.pollHelp=Receiver pulls queued Security Event Tokens from a transmitter-owned poll endpoint (RFC 8936). The endpoint URL is generated by Simlah; no per-receiver allow-list is needed.
ssfReceiverEnabledHelp=If enabled, this client acts as a Shared Signals Framework (SSF) Receiver. Simlah will transmit security events to this client according to the configured SSF stream.
ssfSubjectTypeHelp=How the value below is interpreted when looking up the subject. User options resolve to an Simlah user by email, ID, or username; Organization (by alias) resolves to an Simlah organization. The notification preference is stored as the ssf.notify.${clientId} attribute on the resolved entity.
ssfUserSubjectFormatHelp=Subject identifier format the transmitter uses for the user portion of SSF Security Event Tokens. Defaults to iss_sub (realm issuer + user ID). Select email to emit the user's email address instead. The +tenant variants wrap the user subject in a complex subject and add a tenant sibling carrying the user's Simlah organization alias — use this when the receiver expects multi-tenant routing. Events are dropped (with a clear log entry) when the selected format cannot be produced (e.g. email selected but the user has no email, or +tenant selected but the user belongs to no organization).
ssfAllowEmitEventsHelp=When enabled, a service account holding the role configured below can push synthetic SSF events for this receiver via the admin emit endpoint. Use this for environments where Simlah cannot natively observe upstream events (e.g. credential changes that happen in LDAP). If no role is configured the endpoint is refused. Callers that have permission to manage this client bypass the role check.
validatingX509CertsHelp=The public certificates used by Simlah to validate the signatures of SAML requests and responses from the external IDP when the Use metadata descriptor URL is OFF. Multiple certificates can be entered separated by commas (,). You can reimport certificates from the Metadata descriptor URL by clicking the Import Keys action on the identity provider page. This action downloads the current certificates in the metadata endpoint and assigns them to the config in this same option. Click Save to definitely store the re-imported certificates.
oid4vciEnabledHelp=Enable this option to allow the client to request verifiable credentials from Simlah's OID4VCI credential endpoint.
